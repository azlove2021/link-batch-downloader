# ============ Tauri 桌面壳 ============
# 用现有 index.html / css / js 作为前端，打包成 Windows exe。
# 网页版双击 index.html 仍可独立使用，不依赖本目录。

[package]
name = "office-toolbox-desktop"
version = "1.0.0"
description = "本地离线办公工具箱"
authors = ["azlove2021"]
edition = "2021"

[lib]
name = "office_toolbox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
